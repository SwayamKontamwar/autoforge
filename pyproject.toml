[project]
name = "autoforge"
version = "0.1.0"
description = "A public experiment: a repository that builds real software on its own, several test-guarded commits a day."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
]

[project.optional-dependencies]
# Upper bounds are deliberate. This project installs fresh dependencies on every
# scheduled run, forever, with nobody watching. An unbounded `ruff` would one day
# ship a new rule in the E/F/I sets, start failing lint on files the model never
# touched, and make every future run revert — the repository would look like it
# was running fine while silently never shipping again.
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "builder*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The backlog generator is curated data; long descriptive spec lines are fine.
"tools/gen_backlog.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
