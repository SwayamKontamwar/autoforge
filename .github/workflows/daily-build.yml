name: daily-build

on:
  schedule:
    # Three times a day, roughly four hours apart (UTC). Cron is best-effort.
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider to use (openai, github, mock)"
        required: false
        default: ""

concurrency:
  group: daily-build
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build the next backlog item
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prefer the openai-compatible provider when a key is configured, since
          # GitHub Models is being retired. Falls back to the manual dispatch
          # input, then to 'github'. A run with no reachable provider just logs a
          # "blocked" note and retries next time — it never fails the workflow.
          LLM_PROVIDER: ${{ github.event.inputs.provider || (secrets.LLM_API_KEY && 'openai') || 'github' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          MODEL_ID: ${{ secrets.MODEL_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m builder.run
