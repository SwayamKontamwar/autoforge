name: daily-build

on:
  schedule:
    # Five slots a day, four to five hours apart (UTC). Cron here is best-effort:
    # GitHub both delays and drops scheduled runs under load. Measured over the
    # first day, three slots came due -- two ran, 51 and 65 minutes late, and one
    # never fired. Five are scheduled because only some of them need to land; at
    # one build a day the backlog is still years of work.
    #
    # The top of the hour is when every other scheduled workflow on the platform
    # wakes up, so these deliberately sit at odd minutes to stay out of that peak.
    # The two overnight slots exist because the original three left a sixteen-hour
    # hole in the UTC night where the project simply stopped.
    #
    # Cost of the increase is nil: the free tier allows 1000 requests a day and
    # this uses five, and public repositories get unlimited Actions minutes.
    - cron: "23 02 * * *"
    - cron: "41 07 * * *"
    - cron: "17 13 * * *"
    - cron: "23 17 * * *"
    - cron: "19 21 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider to use (openai, github, mock)"
        required: false
        default: ""

concurrency:
  group: daily-build
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build the next backlog item
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prefer the openai-compatible provider whenever a key is configured, since
          # GitHub Models has been retired. Adding a single LLM_API_KEY secret is
          # enough: base URL and model default to Groq's free tier, and both can be
          # overridden with secrets to point at any other compatible provider.
          # A run with no reachable provider does not fail the workflow — it records
          # the outage and retries later.
          LLM_PROVIDER: ${{ github.event.inputs.provider || (secrets.LLM_API_KEY && 'openai') || 'github' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          MODEL_ID: ${{ secrets.MODEL_ID || 'openai/gpt-oss-120b' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Read by builder/cost.py, which refuses to run if either could be
          # billed. Public repositories get free, uncapped Actions minutes;
          # private ones are metered. ubuntu-latest is free; larger, GPU, macOS
          # and Windows runners are billed per minute even on public repos.
          # tests/test_cost_guard.py asserts both are still passed in and that
          # FORGE_RUNNER matches runs-on, so the guard cannot be quietly
          # unplugged by editing this file.
          FORGE_REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          FORGE_RUNNER: ubuntu-latest
        run: python -m builder.run
