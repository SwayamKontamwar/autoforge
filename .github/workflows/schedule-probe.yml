name: schedule-probe

# Temporary. Answers one question: does a scheduled event actually fire in this
# repository? The build workflow has only ever been started by hand, so the
# unattended premise is unproven. This does nothing but prove the trigger works.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "scheduled event fired at $(date -u --iso-8601=seconds) via ${{ github.event_name }}"
